name: Build Industrial Wood Pellet Prospects
on:
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build curated industrial records
        run: python industrial_users.py
      - name: Commit database
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/industrial_users.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update industrial prospects database'
            git push
          fi
